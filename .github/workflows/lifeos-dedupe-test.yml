name: LifeOS Dedupe Async Test

on:
  push:
    branches:
      - lifeos-production-bootstrap

permissions:
  contents: write

jobs:
  dedupe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: lifeos-production-bootstrap
      - name: Remove duplicated migration lines
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/api/test/http.integration.test.ts')
          text = path.read_text()
          patterns = [
            "import { DocumentProcessingWorkerService } from '../src/processing/document-processing-worker.service.js';\n",
            "let processingWorker: DocumentProcessingWorkerService;\n",
            "  if (!process.env.WORKER_DATABASE_URL && process.env.DATABASE_URL) {\n    process.env.WORKER_DATABASE_URL = process.env.DATABASE_URL;\n  }\n\n",
            "  processingWorker = app.get(DocumentProcessingWorkerService);\n",
            "  assert.equal(readiness.body.capabilities.processingQueue, 'ready');\n  assert.equal(readiness.body.capabilities.processingWorker, 'ready');\n",
          ]
          for pattern in patterns:
              while pattern + pattern in text:
                  text = text.replace(pattern + pattern, pattern)
          path.write_text(text)
          PY
      - name: Commit test cleanup
        run: |
          git config user.name "lifeos-ci"
          git config user.email "lifeos-ci@users.noreply.github.com"
          git add apps/api/test/http.integration.test.ts
          if git diff --cached --quiet; then
            echo "No duplicated migration lines remain"
            exit 0
          fi
          git commit -m "test(processing): remove duplicated async migration lines"
          git push origin HEAD:lifeos-production-bootstrap
