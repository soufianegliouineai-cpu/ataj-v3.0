name: LifeOS Pin Azure Blob Stable

on:
  push:
    branches:
      - lifeos-production-bootstrap

permissions:
  contents: write

jobs:
  pin:
    if: github.actor != 'lifeos-ci'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: lifeos-production-bootstrap
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Pin stable Azure Blob SDK
        working-directory: apps/api
        run: npm install --save-exact @azure/storage-blob@12.33.0 --ignore-scripts --no-audit --no-fund
      - name: Commit package manifest and lock
        run: |
          git config user.name "lifeos-ci"
          git config user.email "lifeos-ci@users.noreply.github.com"
          git add apps/api/package.json apps/api/package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(storage): pin stable Azure Blob SDK 12.33.0"
          git push origin HEAD:lifeos-production-bootstrap
