name: LifeOS CI

on:
  push:
    branches:
      - lifeos-production-bootstrap
  pull_request:
    branches:
      - lifeos-production-bootstrap
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: npm test
      - name: Static production build validation
        run: npm run build
      - name: Verify live production API
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.error
          base='https://kxlrkgbyxplvsvelhdpq.supabase.co/functions/v1/lifeos-api'

          def get(path):
              with urllib.request.urlopen(base+path, timeout=20) as r:
                  return r.status, dict(r.headers), json.load(r)

          def post(path, body, idem=None):
              data=json.dumps(body).encode()
              headers={'Content-Type':'application/json'}
              if idem: headers['Idempotency-Key']=idem
              req=urllib.request.Request(base+path,data=data,headers=headers,method='POST')
              with urllib.request.urlopen(req,timeout=20) as r:
                  return r.status, dict(r.headers), json.load(r)

          status, headers, health=get('/health')
          assert status == 200 and health['ok'] is True
          assert health['version'] == '0.2.0'
          headers_ci={k.lower():v for k,v in headers.items()}\n          assert headers_ci.get('x-lifeos-version') == '0.2.0'

          status, _, ready=get('/readiness')
          assert status == 200 and ready['ready'] is True
          assert ready['capabilities']['persistence'] == 'not_enabled'
          assert ready['capabilities']['authentication'] == 'not_enabled'

          s1, _, p1=post('/v1/protection/passport',{'expiryDate':'2027-06-12'},'ci-stable-001')
          s2, _, p2=post('/v1/protection/passport',{'expiryDate':'2027-06-12'},'ci-stable-001')
          assert s1 == 200 and s2 == 200
          assert p1['data']['deadline']['recommendedActionAt'] == '2027-03-14'
          assert p1['data']['protectionId'] == p2['data']['protectionId']
          assert p1['data']['document']['facts'][0]['provenance']['page'] == 1
          assert p1['data']['evidence']['authoritativeDeadlineComputedByRule'] is True

          bad=urllib.request.Request(
              base+'/v1/protection/passport',
              data=json.dumps({'expiryDate':'2027-02-30'}).encode(),
              headers={'Content-Type':'application/json'},
              method='POST')
          try:
              urllib.request.urlopen(bad,timeout=20)
              raise AssertionError('invalid date unexpectedly succeeded')
          except urllib.error.HTTPError as e:
              payload=json.load(e)
              assert e.code == 400
              assert payload['error']['code'] == 'INVALID_EXPIRY_DATE'

          print('LifeOS API v0.2.0 contract verified')
          PY
