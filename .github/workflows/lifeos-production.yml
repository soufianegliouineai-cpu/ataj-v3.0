name: LifeOS CI

on:
  push:
    branches:
      - lifeos-production-bootstrap
  pull_request:
    branches:
      - lifeos-production-bootstrap
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lifeos_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lifeos_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Unit tests
        run: npm test
      - name: Static production build validation
        run: npm run build
      - name: Install locked NestJS API dependencies
        run: npm ci --prefix apps/api --ignore-scripts --no-audit --no-fund
      - name: Verify NestJS API
        run: npm run verify --prefix apps/api
      - name: Build NestJS production container
        run: docker build -t lifeos-api-ci apps/api
      - name: Boot and probe NestJS production container
        run: |
          docker run -d --name lifeos-api-ci -p 3000:3000 lifeos-api-ci
          cleanup() { docker rm -f lifeos-api-ci >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/v1/health > /tmp/lifeos-health.json; then
              cat /tmp/lifeos-health.json
              node -e "const fs=require('fs');const h=JSON.parse(fs.readFileSync('/tmp/lifeos-health.json','utf8'));if(!h.ok||h.runtime!=='nestjs'||h.version!=='0.3.0')process.exit(1)"
              exit 0
            fi
            sleep 1
          done
          docker logs lifeos-api-ci
          exit 1
      - name: Install PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          psql --version
      - name: Validate provider-neutral LifeOS schema and RLS on PostgreSQL 17
        env:
          PGPASSWORD: postgres
        run: |
          for migration in database/migrations/*.sql; do
            echo "Applying $migration"
            psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d lifeos_ci -f "$migration"
          done
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d lifeos_ci -f database/tests/bootstrap_role.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d lifeos_ci -f database/tests/rls_smoke.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d lifeos_ci -f database/tests/ingestion_pipeline.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d lifeos_ci -f database/tests/integration_fixture.sql
      - name: Verify NestJS PostgreSQL persistence integration
        env:
          DATABASE_URL: postgresql://lifeos_app:lifeos_ci_password@127.0.0.1:5432/lifeos_ci
          DATABASE_SSL: disable
        run: npm run test:integration --prefix apps/api
      - name: Verify live production API
        run: |
          python - <<'PY'
          import json
          import urllib.request
          import urllib.error

          base = 'https://kxlrkgbyxplvsvelhdpq.supabase.co/functions/v1/lifeos-api'

          def get(path):
              with urllib.request.urlopen(base + path, timeout=20) as r:
                  return r.status, dict(r.headers), json.load(r)

          def post(path, body, idem=None, content_type='application/json'):
              data = json.dumps(body).encode() if isinstance(body, dict) else body.encode()
              headers = {'Content-Type': content_type}
              if idem:
                  headers['Idempotency-Key'] = idem
              req = urllib.request.Request(base + path, data=data, headers=headers, method='POST')
              with urllib.request.urlopen(req, timeout=20) as r:
                  return r.status, dict(r.headers), json.load(r)

          def expect_error(req, status, code):
              try:
                  urllib.request.urlopen(req, timeout=20)
                  raise AssertionError(f'{code} unexpectedly succeeded')
              except urllib.error.HTTPError as e:
                  payload = json.load(e)
                  assert e.code == status, (e.code, payload)
                  assert payload['error']['code'] == code, payload

          status, headers, health = get('/health')
          assert status == 200 and health['ok'] is True
          assert health['version'] == '0.3.0'
          headers_ci = {k.lower(): v for k, v in headers.items()}
          assert headers_ci.get('x-lifeos-version') == '0.3.0'
          assert headers_ci.get('cache-control') == 'no-store'

          status, _, ready = get('/readiness')
          assert status == 200 and ready['ready'] is True
          assert ready['capabilities']['genericExpiryProtection'] == 'ready'
          assert ready['capabilities']['ocrExtraction'] == 'not_enabled'
          assert ready['capabilities']['jurisdictionRules'] == 'not_enabled'

          status, _, types = get('/v1/document-types')
          assert status == 200
          assert {'passport','identity_card','driving_license','insurance','visa'}.issubset(set(types['data']))

          body = {'documentType':'driving_license','expiryDate':'2027-08-20','leadDays':60}
          s1, _, p1 = post('/v1/protection/expiry', body, 'ci-v03-001')
          s2, _, p2 = post('/v1/protection/expiry', body, 'ci-v03-001')
          assert s1 == 200 and s2 == 200
          assert p1['data']['deadline']['recommendedActionAt'] == '2027-06-21'
          assert p1['data']['protectionId'] == p2['data']['protectionId']
          fact = p1['data']['document']['facts'][0]
          assert fact['trustClass'] == 'USER_CONFIRMED'
          assert fact['origin'] == 'user_confirmed'
          assert p1['data']['evidence']['aiExtractionPerformed'] is False
          assert p1['data']['evidence']['legalRuleApplied'] is False

          expired_status, _, expired = post(
              '/v1/protection/expiry',
              {'documentType':'passport','expiryDate':'2025-01-01','leadDays':90},
              'ci-expired-001',
          )
          assert expired_status == 200
          assert expired['data']['deadline']['status'] == 'overdue'
          assert expired['data']['deadline']['severity'] == 'overdue'
          assert expired['data']['task']['status'] == 'action_due'

          bad_type = urllib.request.Request(
              base + '/v1/protection/expiry',
              data=json.dumps({'documentType':'made_up_document','expiryDate':'2027-08-20'}).encode(),
              headers={'Content-Type':'application/json'},
              method='POST',
          )
          expect_error(bad_type, 400, 'INVALID_DOCUMENT_TYPE')

          bad_date = urllib.request.Request(
              base + '/v1/protection/expiry',
              data=json.dumps({'documentType':'passport','expiryDate':'2027-02-30'}).encode(),
              headers={'Content-Type':'application/json'},
              method='POST',
          )
          expect_error(bad_date, 400, 'INVALID_EXPIRY_DATE')

          bad_lead = urllib.request.Request(
              base + '/v1/protection/expiry',
              data=json.dumps({'documentType':'passport','expiryDate':'2027-06-12','leadDays':0}).encode(),
              headers={'Content-Type':'application/json'},
              method='POST',
          )
          expect_error(bad_lead, 400, 'INVALID_LEAD_DAYS')

          wrong_type = urllib.request.Request(
              base + '/v1/protection/expiry',
              data='plain text'.encode(),
              headers={'Content-Type':'text/plain'},
              method='POST',
          )
          expect_error(wrong_type, 415, 'UNSUPPORTED_MEDIA_TYPE')

          wrong_method = urllib.request.Request(base + '/v1/protection/expiry', method='GET')
          expect_error(wrong_method, 405, 'METHOD_NOT_ALLOWED')

          long_idem = urllib.request.Request(
              base + '/v1/protection/expiry',
              data=json.dumps({'documentType':'passport','expiryDate':'2027-06-12'}).encode(),
              headers={'Content-Type':'application/json','Idempotency-Key':'x'*201},
              method='POST',
          )
          expect_error(long_idem, 400, 'INVALID_IDEMPOTENCY_KEY')

          print('LifeOS API v0.3.0 success and failure contracts verified')
          PY
