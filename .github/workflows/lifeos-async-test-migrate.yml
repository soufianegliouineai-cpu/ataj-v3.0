name: LifeOS Async Test Migration

on:
  push:
    branches:
      - lifeos-production-bootstrap

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'lifeos-ci'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: lifeos-production-bootstrap
      - name: Migrate integration contract to durable worker
        run: |
          python - <<'PY'
          from pathlib import Path

          test = Path('apps/api/test/http.integration.test.ts')
          text = test.read_text()

          import_anchor = "import { configureApp } from '../src/configure-app.js';\n"
          import_line = "import { DocumentProcessingWorkerService } from '../src/processing/document-processing-worker.service.js';\n"
          if import_line not in text:
              text = text.replace(import_anchor, import_anchor + import_line)

          variable_anchor = "let lastOcrRequestSha256: string | null = null;\n"
          variable_line = "let processingWorker: DocumentProcessingWorkerService;\n"
          if variable_line not in text:
              text = text.replace(variable_anchor, variable_anchor + variable_line)

          init_anchor = "  configureApp(app);\n  await app.init();\n"
          init_replacement = init_anchor + "  processingWorker = app.get(DocumentProcessingWorkerService);\n"
          if "processingWorker = app.get(DocumentProcessingWorkerService);" not in text:
              text = text.replace(init_anchor, init_replacement, 1)

          readiness_anchor = "  assert.equal(readiness.body.capabilities.documentProcessing, 'ready');\n"
          readiness_extra = (
              "  assert.equal(readiness.body.capabilities.processingQueue, 'ready');\n"
              "  assert.equal(readiness.body.capabilities.processingWorker, 'ready');\n"
          )
          if "capabilities.processingWorker" not in text:
              text = text.replace(readiness_anchor, readiness_anchor + readiness_extra)

          old = '''  const processed = await request(app.getHttpServer())
    .post(`/v1/households/${householdId}/uploads/${uploadIntent.body.data.id}/process`)
    .set('Authorization', `Bearer ${token}`)
    .expect(201);

  assert.equal(processed.body.data.status, 'succeeded');
  assert.equal(processed.body.data.replayed, false);
  assert.equal(processed.body.data.sourceIntegrity.sha256, uploadSha256);
  assert.equal(processed.body.data.sourceIntegrity.sizeBytes, uploadBytes.length);
  assert.equal(processed.body.data.sourceIntegrity.reverifiedBeforeOcr, true);
  assert.equal(processed.body.data.engine.provider, 'azure_document_intelligence');
  assert.equal(processed.body.data.engine.modelName, 'prebuilt-idDocument');
  assert.equal(processed.body.data.engine.apiVersion, '2024-11-30');
  assert.equal(processed.body.data.fieldCount, 2);
  assert.equal(lastOcrRequestSha256, uploadSha256);
  assert.ok(ocrPollCount >= 2);

  const extractionRunId = processed.body.data.extractionRunId as string;
  assert.match(extractionRunId, /^[0-9a-f-]{36}$/i);
'''
          new = '''  const queued = await request(app.getHttpServer())
    .post(`/v1/households/${householdId}/uploads/${uploadIntent.body.data.id}/process`)
    .set('Authorization', `Bearer ${token}`)
    .expect(202);

  assert.equal(queued.body.data.status, 'queued');
  assert.equal(queued.body.data.replayed, false);
  assert.equal(queued.body.data.attemptCount, 0);
  assert.equal(queued.body.meta.execution, 'durable_postgres_queue');

  const queuedStatus = await request(app.getHttpServer())
    .get(`/v1/households/${householdId}/uploads/${uploadIntent.body.data.id}/process`)
    .set('Authorization', `Bearer ${token}`)
    .expect(200);

  assert.equal(queuedStatus.body.data.status, 'queued');
  assert.equal(queuedStatus.body.data.extractionRunId, null);

  const workerResult = await processingWorker.runOnce();
  assert.equal(workerResult.claimed, true);
  assert.equal(workerResult.status, 'succeeded');
  if (!workerResult.claimed || workerResult.status !== 'succeeded') {
    throw new Error('Durable processing worker did not succeed.');
  }
  assert.equal(workerResult.sourceIntegrity.sha256, uploadSha256);
  assert.equal(workerResult.sourceIntegrity.sizeBytes, uploadBytes.length);
  assert.equal(workerResult.sourceIntegrity.reverifiedBeforeOcr, true);
  assert.equal(workerResult.engine.provider, 'azure_document_intelligence');
  assert.equal(workerResult.engine.modelName, 'prebuilt-idDocument');
  assert.equal(workerResult.engine.apiVersion, '2024-11-30');
  assert.equal(workerResult.fieldCount, 2);
  assert.equal(lastOcrRequestSha256, uploadSha256);
  assert.ok(ocrPollCount >= 2);

  const processed = await request(app.getHttpServer())
    .get(`/v1/households/${householdId}/uploads/${uploadIntent.body.data.id}/process`)
    .set('Authorization', `Bearer ${token}`)
    .expect(200);

  assert.equal(processed.body.data.status, 'succeeded');
  assert.equal(processed.body.data.attemptCount, 1);
  assert.equal(processed.body.meta.execution, 'durable_postgres_queue');

  const extractionRunId = processed.body.data.extractionRunId as string;
  assert.match(extractionRunId, /^[0-9a-f-]{36}$/i);
'''
          if old in text:
              text = text.replace(old, new)
          elif "const queued = await request(app.getHttpServer())" not in text:
              raise SystemExit('synchronous processing block not found')

          old_replay = '''  const processingReplay = await request(app.getHttpServer())
    .post(`/v1/households/${householdId}/uploads/${uploadIntent.body.data.id}/process`)
    .set('Authorization', `Bearer ${token}`)
    .expect(201);

  assert.equal(processingReplay.body.data.replayed, true);
  assert.equal(processingReplay.body.data.extractionRunId, extractionRunId);
'''
          new_replay = '''  const processingReplay = await request(app.getHttpServer())
    .post(`/v1/households/${householdId}/uploads/${uploadIntent.body.data.id}/process`)
    .set('Authorization', `Bearer ${token}`)
    .expect(202);

  assert.equal(processingReplay.body.data.replayed, true);
  assert.equal(processingReplay.body.data.status, 'succeeded');
  assert.equal(processingReplay.body.data.extractionRunId, extractionRunId);
'''
          if old_replay in text:
              text = text.replace(old_replay, new_replay)

          test.write_text(text)

          workflow = Path('.github/workflows/lifeos-production.yml')
          flow = workflow.read_text()
          old_env = '''          MALWARE_SCAN_MAX_BYTES: "26214400"
        run: npm run test:integration --prefix apps/api
'''
          new_env = '''          MALWARE_SCAN_MAX_BYTES: "26214400"
          PGPASSWORD: postgres
        run: |
          export WORKER_DATABASE_URL="postgresql://postgres:${PGPASSWORD}@127.0.0.1:5432/lifeos_ci"
          npm run test:integration --prefix apps/api
'''
          if old_env in flow:
              flow = flow.replace(old_env, new_env)
          elif 'WORKER_DATABASE_URL=' not in flow:
              raise SystemExit('integration workflow env anchor not found')
          workflow.write_text(flow)
          PY
      - name: Commit async integration migration
        run: |
          git config user.name "lifeos-ci"
          git config user.email "lifeos-ci@users.noreply.github.com"
          git add apps/api/test/http.integration.test.ts .github/workflows/lifeos-production.yml
          if git diff --cached --quiet; then
            echo "Async integration contract already migrated"
            exit 0
          fi
          git commit -m "test(processing): verify durable async worker flow"
          git push origin HEAD:lifeos-production-bootstrap
