name: ATAJ 80 Apocalypses
on: [push]
jobs:
 test:
 runs-on: ubuntu-latest
 steps:
 - uses: actions/checkout@v4
 - run: cd compiler && chmod +x build.sh &&./build.sh
 - run:./target/release/atajc test --tier all
 - run:./target/release/atajc audit --export audit.pdf
 - uses: actions/upload-artifact@v4
 with:
 name: audit-report
 path: audit.pdf
