services:
  - type: web
    name: lifeos-ai-prod
    runtime: static
    branch: lifeos-production-bootstrap
    buildCommand: npm run verify && rm -rf dist && mkdir -p dist && cp index.html dist/index.html
    staticPublishPath: dist
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
