services:
  - type: web
    name: lifeos-web
    runtime: static
    branch: lifeos-production-bootstrap
    buildCommand: echo "LifeOS static build ready"
    staticPublishPath: .
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
