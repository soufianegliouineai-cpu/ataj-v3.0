apiVersion: apps/v1
kind: Deployment
metadata:
  name: ataj-app
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
  template:
    spec:
      containers:
        - name: ataj
          image: ataj/ataj:3.0
          resources:
            limits:
              cpu: "1000m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /health
              initialDelaySeconds: 3
            periodSeconds: 5

RTO guarantee: K8s restarts in 3s
